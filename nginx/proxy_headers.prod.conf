# Cabeçalhos repassados ao Django em PRODUÇÃO. Mesma regra do
# proxy_headers.conf de desenvolvimento (todo `location` inclui este arquivo;
# nada de proxy_set_header no `server`), com duas diferenças que existem por
# causa do Caddy do host, que termina o TLS na frente deste Nginx (ADR-011):
#
# - X-Forwarded-Proto é REPASSADO do Caddy, não calculado aqui. Este Nginx
#   recebe http puro; com `$scheme` o Django veria "http", o
#   SECURE_SSL_REDIRECT do prod.py mandaria para https, o Caddy devolveria
#   http de novo — loop de redirect.
# - $host no lugar de $http_host: em produção a origem é
#   https://ppgm.direito.ufmg.br, sem porta a preservar.
#
# O $remote_addr já chega corrigido pelo real_ip do nginx.prod.conf.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
