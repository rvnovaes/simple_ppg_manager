# Pipeline do GitLab: roda `make ready` a cada push e, na main, publica em
# https://ppgm.direito.ufmg.br (ADR-011).
#
#   verificar  (todo push)  `make ready` — lint, typecheck e test
#   construir  (só main)    imagens de produção -> registry do GitLab
#   publicar   (só main)    SSH no servidor: pull, migrate, subir
#
# A regra do projeto é "make ready verde é pré-condição de qualquer commit"
# (CLAUDE.md, Seção 7). O `verificar` cobra isso de quem esqueceu de rodar
# antes do push, e é também o que segura o deploy: com ele vermelho, nada
# é construído nem publicado.
#
# Um job só no `verificar`, de propósito: `make ready` já encadeia lint,
# typecheck e test nas duas metades (backend e frontend), e o time não
# precisa de um grafo de jobs para ler o resultado — ou está verde, ou o log
# diz o que quebrou.
#
# Executa fora do canteiro, no runner do GitLab: mudar este arquivo é
# human_gate no CLAUDE.md, e por isso ele nunca é editado pelo loop.
#
# Variáveis que o `publicar` exige, em Settings > CI/CD > Variables, todas
# Protected (só a main as enxerga):
#   SSH_PRIVATE_KEY   tipo File — chave de deploy (não a pessoal de ninguém)
#   SSH_KNOWN_HOSTS   tipo File — `ssh-keyscan 150.164.104.58`
#   DEPLOY_TARGET     tipo Variable — usuario@150.164.104.58

stages:
  - verificar
  - construir
  - publicar

variables:
  # O Postgres sobe como "service" (abaixo) e responde pelo nome da imagem,
  # `postgres`, na porta padrão — não na 5433 do host, que é coisa do Compose.
  # Mesmo usuário/senha/banco do `.env.example` e do docker-compose.yml.
  POSTGRES_DB: ppg
  POSTGRES_USER: ppg
  POSTGRES_PASSWORD: ppg
  DATABASE_URL: postgres://ppg:ppg@postgres:5432/ppg
  # Só para o Django subir; nenhum segredo real entra aqui. `DEBUG` não é
  # necessário: o pytest usa `config.settings.dev`, que já o liga.
  SECRET_KEY: ci-inseguro-nao-usar-em-producao
  # Caches dentro do projeto, porque só o que está em $CI_PROJECT_DIR pode
  # ser guardado entre pipelines pelo `cache:` abaixo.
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_PYTHON_INSTALL_DIR: $CI_PROJECT_DIR/.cache/uv-python
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm

ready:
  stage: verificar
  # A imagem é a do Node (glibc — o rollup e o @tailwindcss/oxide do
  # package-lock são binários linux-x64-gnu, e em musl não carregam; ver a
  # seção 7 do Manual do Desenvolvedor no README.md). O Python 3.14 do
  # `backend/.python-version` quem traz é o próprio uv, que o baixa para UV_PYTHON_INSTALL_DIR e o guarda no
  # cache. Assim não há imagem própria para manter.
  image: node:25-bookworm
  services:
    # Mesma major do docker-compose.yml. Trocar aqui e lá juntos.
    - postgres:17.5-alpine
  cache:
    # A chave muda quando um lockfile muda; até lá o pipeline reaproveita
    # pacotes Python, o interpretador e os tarballs do npm.
    key:
      files:
        - backend/uv.lock
        - frontend/package-lock.json
    paths:
      - .cache/
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv --version && node --version
    # `--locked` e `npm ci`, nunca `uv sync`/`npm install`: os dois últimos
    # reescrevem o lockfile em silêncio e o pipeline passaria com dependência
    # diferente da que está versionada (mesma regra do obra.conf).
    - cd backend && uv sync --locked && cd ..
    - cd frontend && npm ci && cd ..
  script:
    - make ready
    # `make lint` FORMATA (ruff format, ruff check --fix, prettier --write)
    # em vez de só conferir, e sai com zero mesmo quando reescreveu arquivo.
    # No computador do dev isso é o que se quer; aqui, o que se quer é
    # recusar código que chegou sem formatar. Se o lint mexeu em algo, a
    # árvore fica suja e este diff acusa — o log mostra exatamente o quê.
    - git diff --exit-code
  rules:
    # Todo push em qualquer branch. Sem job em tag nem em agenda por enquanto.
    - if: $CI_COMMIT_BRANCH

# Imagens de produção: backend (gunicorn) e web (Nginx + build do front).
# Vão para o registry do projeto com a tag do commit — é essa tag que o
# servidor publica, então cada deploy aponta para uma imagem imutável e voltar
# atrás é reexecutar o `publicar` de um pipeline antigo.
construir:
  stage: construir
  needs: [ready]
  image: docker:28
  # Docker-in-Docker: exige o runner com `privileged = true`.
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -f backend/Dockerfile.prod -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" backend
    # Contexto na raiz: a imagem web precisa de frontend/ e nginx/.
    - docker build -f nginx/Dockerfile.prod -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy: copia o compose e o deploy.sh para /opt/ppgm e roda o script lá.
# O que ele faz, e em que ordem, está no próprio deploy/deploy.sh.
publicar:
  stage: publicar
  needs: [construir]
  image: alpine:3.22
  # Um deploy de cada vez: dois pushes seguidos na main não disputam o
  # servidor — o segundo espera o primeiro terminar.
  resource_group: producao
  environment:
    name: producao
    url: https://ppgm.direito.ufmg.br
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - scp -i "$SSH_PRIVATE_KEY" deploy/docker-compose.yml deploy/deploy.sh "$DEPLOY_TARGET:/opt/ppgm/"
    # O token do job vai pela entrada padrão (ver o cabeçalho do deploy.sh).
    - printf '%s' "$CI_JOB_TOKEN" | ssh -i "$SSH_PRIVATE_KEY" "$DEPLOY_TARGET" /opt/ppgm/deploy.sh "$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
