# Perfil de desenvolvimento: db + backend + nginx.
# Sobe com `make up` e abre em http://localhost:8080 — NUNCA em :5173.
# Ver ADR-004 (origem única) para o porquê.

# Nome do projeto fixado de propósito. Sem isto o Compose o deriva do nome
# da PASTA — e renomear o diretório passa a criar um projeto novo, com
# containers e volume vazios, "perdendo" o banco sem ter apagado nada.
name: simple_ppg_manager

services:
  db:
    # Trocar a major (17 -> 18, por exemplo) invalida o volume: o Postgres
    # não lê um data dir criado por outra major. O caminho é pg_dump antes,
    # recriar o volume e restaurar — nunca só trocar a tag.
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppg}
      POSTGRES_USER: ${POSTGRES_USER:-ppg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppg}
    ports:
      # Exposto no host para permitir `make run` (Django nativo, sem container).
      # 5433 por padrão: a 5432 desta máquina já é de outro projeto.
      #
      # DB_PORT vem antes porque é o nome que o chef-helena-dev escreve no .env da
      # worktree ao subir uma stack efêmera; DB_HOST_PORT é o nome deste projeto e
      # continua valendo para o `make up` de todo dia.
      - "${DB_PORT:-${DB_HOST_PORT:-5433}}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppg} -d ${POSTGRES_DB:-ppg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:-dev-inseguro-nao-usar-em-producao}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      # O default acompanha NGINX_PORT: numa stack efêmera o .env da worktree não traz
      # CSRF_TRUSTED_ORIGINS, e um valor fixo apontaria para a porta de outra stack.
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:${NGINX_PORT:-8080}}
      # Dentro da rede do compose o banco atende em "db".
      DATABASE_URL: postgres://${POSTGRES_USER:-ppg}:${POSTGRES_PASSWORD:-ppg}@db:5432/${POSTGRES_DB:-ppg}
      # Em desenvolvimento todo e-mail vai para o Mailpit desta stack e para
      # em lugar nenhum fora dela (ADR-009). O default do base.py é o backend
      # de console; aqui trocamos por SMTP para exercitar o caminho real.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-nao-responda@ppgd.local}
      # O link que sai no e-mail é aberto no navegador do destinatário, então
      # aponta para a porta publicada do Nginx DESTE canteiro.
      SITE_URL: ${SITE_URL:-http://localhost:${NGINX_PORT:-8080}}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: uv run python manage.py runserver 0.0.0.0:8000

  # Captura de e-mail em desenvolvimento: recebe SMTP em 1025 e mostra as
  # mensagens numa UI em 8025. Nada sai daqui para a internet — é o que torna
  # seguro exercitar convocação e link de assinatura dentro do canteiro.
  #
  # Sem porta publicada nesta story: para abrir a UI no host, ou se faz um
  # `docker compose port mailpit 8025`, ou se espera a story que publica
  # MAILPIT_UI_PORT por canteiro. De dentro da stack a UI e a API HTTP
  # respondem em http://mailpit:8025 — a imagem do backend não tem curl, então
  # a conferência sai por `python -c "import urllib.request; ..."`.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      # Sem volume de propósito: o histórico de e-mail de desenvolvimento não
      # sobrevive (nem precisa sobreviver) ao `docker compose down`.
      MP_MAX_MESSAGES: 500

  # Servidor de desenvolvimento do front. Fica no Compose, e não no host, para
  # que a porta do Vite deixe de ser um recurso disputado: aqui a 5173 é um
  # endereço da rede interna DESTA stack, então N canteiros rodam N Vites sem
  # combinar porta nenhuma. É também o que dispensa o `host.docker.internal`.
  #
  # Só existe em desenvolvimento. Em produção não há processo Node: o Nginx
  # serve o build do adapter-static direto do disco (ADR-005).
  frontend:
    # `-slim` (Debian, glibc) e não `-alpine` (musl) de propósito: o
    # node_modules é o MESMO do host, montado abaixo, e o `npm ci` de lá baixa
    # os binários `linux-x64-gnu` do rollup e do @tailwindcss/oxide. Numa
    # imagem musl eles não carregam, e o erro sai como "cannot find module"
    # de um pacote que está lá.
    image: node:25-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      # A porta publicada do Nginx, que é por onde o NAVEGADOR fala. O cliente
      # de HMR precisa dela para abrir o WebSocket na origem certa; sem isto
      # ele tenta a porta em que o Vite escuta, que não é publicada.
      NGINX_PORT: ${NGINX_PORT:-8080}
    command: npm run dev
    # Sem porta publicada: quem atende o navegador é o Nginx. Abrir o Vite
    # direto quebra login e CSRF (ADR-004).

  nginx:
    image: nginx:alpine
    ports:
      # Porta cravada colide: duas stacks deste projeto no mesmo host disputam a 8080.
      # NGINX_PORT é o nome que a esteira escreve no .env da worktree; sem ele
      # o valor de sempre continua valendo.
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
