# Perfil de desenvolvimento: db + backend + nginx.
# Sobe com `make up` e abre em http://localhost:8080 — NUNCA em :5173.
# Ver ADR-004 (origem única) para o porquê.

# Nome do projeto fixado de propósito. Sem isto o Compose o deriva do nome
# da PASTA — e renomear o diretório passa a criar um projeto novo, com
# containers e volume vazios, "perdendo" o banco sem ter apagado nada.
name: simple_ppg_manager

services:
  db:
    # Trocar a major (17 -> 18, por exemplo) invalida o volume: o Postgres
    # não lê um data dir criado por outra major. O caminho é pg_dump antes,
    # recriar o volume e restaurar — nunca só trocar a tag.
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppgd}
      POSTGRES_USER: ${POSTGRES_USER:-ppgd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppgd}
    ports:
      # Exposto no host para permitir `make run` (Django nativo, sem container).
      # 5433 por padrão: a 5432 desta máquina já é de outro projeto.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppgd} -d ${POSTGRES_DB:-ppgd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:-dev-inseguro-nao-usar-em-producao}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      # Dentro da rede do compose o banco atende em "db".
      DATABASE_URL: postgres://${POSTGRES_USER:-ppgd}:${POSTGRES_PASSWORD:-ppgd}@db:5432/${POSTGRES_DB:-ppgd}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uv run python manage.py runserver 0.0.0.0:8000

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      - backend
    extra_hosts:
      # Permite ao Nginx no container alcançar o Vite rodando no host (make web).
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
