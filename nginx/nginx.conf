# Origem única — ADR-004. Front e API atendem no MESMO host:porta.
# É esta configuração que faz o cookie de sessão e o CSRF funcionarem
# sem CORS. Se você sentiu vontade de configurar CORS, o erro está aqui.
#
# Regra deste arquivo: todo `location` começa com o include dos cabeçalhos.
# Ver o comentário em proxy_headers.conf para o porquê.

upstream django {
    server backend:8000;
}

# Vite no serviço `frontend` da própria stack. A 5173 aqui é INTERNA à rede
# deste compose — por isso não precisa ser parametrizada, e dois canteiros
# rodando ao mesmo tempo não disputam nada. (Antes isto apontava para
# host.docker.internal:5173, e os N canteiros caíam todos no mesmo Vite do
# host, servindo o código de uma worktree só.)
upstream vite {
    server frontend:5173;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 25m;

    # O Nginx escuta na 80 dentro do container, mas é publicado na 8080. Sem
    # isto ele monta os próprios redirects como "http://localhost/..." — com a
    # porta interna — e o navegador vai parar na porta 80, que não é nossa.
    # Desligando, o Location sai relativo e o navegador resolve na origem certa.
    absolute_redirect off;

    # A inscrição pública sobe de cinco a sete anexos numa requisição só
    # (é um POST, porque o candidato não tem login para guardar rascunho),
    # e o `client_max_body_size` do server não cobre isso. O limite maior
    # vale SÓ neste prefixo: as demais rotas continuam nos 25m da linha 25,
    # e o `location` mais longo é o que o Nginx escolhe.
    location /api/v1/selection/public/ {
        include /etc/nginx/proxy_headers.conf;
        client_max_body_size 80m;
        proxy_pass http://django;
    }

    location /api/ {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://django;
    }

    # Sem estes dois `location =`, "/admin" e "/api" (sem a barra final) não
    # casam com os blocos abaixo e caem no `location /`, que serve a SPA.
    location = /admin {
        return 301 /admin/;
    }

    location = /api {
        return 301 /api/v1/docs;
    }

    location /admin/ {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://django;
    }

    # Estáticos do Django: CSS/JS do Admin e uploads.
    location /static/ {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://django;
    }

    location /media/ {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://django;
    }

    # DEV: a SPA vem do Vite, com HMR via WebSocket.
    #
    # PRODUÇÃO: trocar este bloco inteiro por servir o build estático
    # do adapter-static direto do disco (sem processo Node — ADR-005):
    #
    #     location / {
    #         root      /var/www/ppgd;      # saída de `npm run build`
    #         try_files $uri $uri/ /index.html;
    #     }
    location / {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
