# Cabeçalhos repassados a todo upstream.
#
# Este arquivo existe por causa de uma armadilha do Nginx: declarar QUALQUER
# proxy_set_header dentro de um `location` descarta todos os proxy_set_header
# herdados do bloco `server` — eles substituem, não somam. Um `location` que
# só quisesse acrescentar o header de WebSocket perderia o Host, e aí o
# Django passa a recusar o login com "CSRF verification failed".
#
# Por isso: nada de proxy_set_header no `server`. Todo `location` inclui este
# arquivo, e quem precisar de header extra o declara logo depois do include.

# $http_host e NÃO $host: o primeiro preserva a porta ("localhost:8080"), o
# segundo a descarta ("localhost"). Com $host, todo redirect absoluto gerado
# pelo upstream — o /admin -> /admin/ do Django, por exemplo — sai apontando
# para a porta 80 e o navegador cai no vazio.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
