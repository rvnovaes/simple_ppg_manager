# Origem única em PRODUÇÃO — ADR-004 e ADR-005. Mesma forma do nginx.conf de
# desenvolvimento, trocando o Vite pelo build estático do front, servido do
# disco, e servindo /static/ e /media/ direto dos volumes.
#
# Na frente deste Nginx está o Caddy do host, que termina o TLS de
# ppgm.direito.ufmg.br e repassa para 127.0.0.1:8100 (ADR-011).

upstream django {
    server backend:8000;
}

# O IP do cliente vem do Caddy no X-Forwarded-For. Sem isto $remote_addr
# seria o gateway da rede do Docker para TODO acesso, e o rate limit
# (apps/core/ratelimit.py, que lê o X-Real-IP) poria o mundo inteiro no mesmo
# balde. Só se confia no cabeçalho vindo de rede privada — que é de onde o
# Caddy chega, já que a porta publicada é só em 127.0.0.1.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    absolute_redirect off;
    server_tokens off;

    # Mesmo limite maior do desenvolvimento: a inscrição pública sobe de
    # cinco a sete anexos num POST só.
    location /api/v1/selection/public/ {
        include /etc/nginx/proxy_headers.conf;
        client_max_body_size 80m;
        proxy_pass http://django;
    }

    location /api/ {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://django;
        # Geração de PDF acontece dentro do request (mesmo timeout do gunicorn).
        proxy_read_timeout 120s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /api {
        return 301 /api/v1/docs;
    }

    location /admin/ {
        include /etc/nginx/proxy_headers.conf;
        proxy_pass http://django;
    }

    # `collectstatic` grava no volume `static`, montado aqui só para leitura.
    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    # Uploads: volume `media`. Os anexos sensíveis (documento de candidato,
    # comprovante) NUNCA têm a URL publicada pela API — saem só pelas rotas de
    # download, que checam permissão e auditam (ver ApplicationDocumentOut em
    # apps/selection/schemas.py). Aqui chega o que é público: o PDF do edital.
    location /media/ {
        alias /srv/media/;
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre.
    location /_app/immutable/ {
        root /srv/front;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # A SPA: arquivo que existe no build, ou o index.html (fallback do
    # adapter-static), para o roteador do SvelteKit resolver no navegador.
    location / {
        root /srv/front;
        try_files $uri $uri/ /index.html;
        # O index.html não pode ficar em cache: é ele que aponta para os
        # arquivos da versão nova depois de um deploy.
        add_header Cache-Control "no-cache";
    }
}
