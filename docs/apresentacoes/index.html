<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Índice de apresentações do Simple PPG Manager">
  <title>Apresentações | Simple PPG Manager</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f6f8;
      --surface: #ffffff;
      --text: #17202a;
      --muted: #65717e;
      --accent: #1d5d8f;
      --accent-dark: #15466c;
      --border: #dbe2e8;
      --shadow: 0 10px 30px rgba(23, 32, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(29, 93, 143, 0.12), transparent 30rem),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(960px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 4rem 0;
    }

    header {
      margin-bottom: 2.5rem;
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 42rem;
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    section + section {
      margin-top: 2.5rem;
    }

    h2 {
      margin: 0 0 1rem;
      font-size: 1.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      display: flex;
      min-height: 150px;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 14px 36px rgba(23, 32, 42, 0.13);
      outline: none;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .arrow {
      color: var(--accent);
      font-size: 1.25rem;
      font-weight: 700;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-dark);
    }

    @media (max-width: 520px) {
      main {
        padding: 2.5rem 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Simple PPG Manager</p>
      <h1>Apresentações</h1>
      <p class="intro">Selecione uma apresentação para abri-la diretamente no navegador.</p>
    </header>

    <section aria-labelledby="geral">
      <h2 id="geral">Geral</h2>
      <div class="grid">
        <a class="card" href="professores-alunos-acerto-matricula.html">
          <span class="card-title">Acerto de matrícula</span>
          <span class="card-meta">
            <span>Professores e alunos</span>
            <span class="arrow" aria-hidden="true">→</span>
          </span>
        </a>
      </div>
    </section>

    <section aria-labelledby="integracao">
      <h2 id="integracao">Integração</h2>
      <div class="grid">
        <a class="card" href="integracao/aula-1.html">
          <span class="card-title">Aula 1</span>
          <span class="card-meta"><span>Integração</span><span class="arrow" aria-hidden="true">→</span></span>
        </a>
        <a class="card" href="integracao/aula-2.html">
          <span class="card-title">Aula 2</span>
          <span class="card-meta"><span>Integração</span><span class="arrow" aria-hidden="true">→</span></span>
        </a>
        <a class="card" href="integracao/aula-3.html">
          <span class="card-title">Aula 3</span>
          <span class="card-meta"><span>Integração</span><span class="arrow" aria-hidden="true">→</span></span>
        </a>
        <a class="card" href="integracao/aula-4.html">
          <span class="card-title">Aula 4</span>
          <span class="card-meta"><span>Integração</span><span class="arrow" aria-hidden="true">→</span></span>
        </a>
        <a class="card" href="integracao/aula-5.html">
          <span class="card-title">Aula 5</span>
          <span class="card-meta"><span>Integração</span><span class="arrow" aria-hidden="true">→</span></span>
        </a>
      </div>
    </section>

    <footer>
      <a href="https://github.com/rvnovaes/simple_ppg_manager">Ver o repositório no GitHub</a>
    </footer>
  </main>
</body>
</html>
