<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aula 6 da integração de novos membros do PPGD Manager">
  <title>Aula 6 — Continuous Integration com Ansible</title>
  <style>
    :root {
      --paper: #f6f8f7;
      --surface: #eaf0ee;
      --surface-2: #dfe8e5;
      --ink: #1b2523;
      --ink-soft: #45524e;
      --ink-faint: #6b7a75;
      --accent: #0f6b77;
      --accent-soft: #d8e8ea;
      --line: #c9d4d0;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #101716;
        --surface: #182220;
        --surface-2: #1f2c29;
        --ink: #dde6e3;
        --ink-soft: #a6b5b0;
        --ink-faint: #7c8b86;
        --accent: #56b7c0;
        --accent-soft: #123a3f;
        --line: #2b3835;
      }
    }
    :root[data-theme="dark"] {
      --paper: #101716;
      --surface: #182220;
      --surface-2: #1f2c29;
      --ink: #dde6e3;
      --ink-soft: #a6b5b0;
      --ink-faint: #7c8b86;
      --accent: #56b7c0;
      --accent-soft: #123a3f;
      --line: #2b3835;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.65;
      margin: 0;
      font-size: 1rem;
    }
    main {
      max-width: 46rem;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 6rem;
    }
    h1 {
      font-family: Charter, Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      line-height: 1.1;
      margin: 0.5rem 0 0;
      text-wrap: balance;
      font-weight: 700;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 600;
    }
    header.hero {
      border-bottom: 3px double var(--line);
      padding-bottom: 1.8rem;
      margin-bottom: 1rem;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="eyebrow">Integração de novos membros · aula 6 · ci · ansible</div>
      <h1>Aula 6 — Continuous Integration com Ansible</h1>
    </header>
  </main>
</body>
</html>
