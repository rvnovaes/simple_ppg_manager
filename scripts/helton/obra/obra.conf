# obra.conf — o que a esteira precisa saber sobre ESTE projeto.
#
# É o único arquivo que você edita para aplicar a esteira a um repositório novo.
# Os scripts de `scripts/helton/obra/` o carregam com `source`; portanto vale sintaxe de
# bash, inclusive funções.
#
# Preenchido para o simple_ppg_manager: Django 5 + django-ninja no backend,
# SvelteKit no frontend, Postgres 17 e Nginx no Compose.

# ── Base ─────────────────────────────────────────────────────────────
# A branch de onde toda worktree é derivada. É sempre uma ref REMOTA: a esteira
# inteira parte do princípio de que worktree só enxerga o que foi commitado e
# pushado.
BASE_BRANCH="origin/main"

# ── Serviços do Compose ──────────────────────────────────────────────
# O banco sobe primeiro e sozinho, porque as migrations dependem dele.
DB_SERVICE="db"

# Serviço de uma tacada só que aplica as migrations (roda e sai). Deixe vazio se
# o seu projeto não tiver um — o passo é pulado.
#
# VAZIO DE PROPÓSITO. Este compose não tem serviço de migração: o `backend` é um
# runserver de longa duração, e `docker compose run --rm backend` executaria o
# CMD dele — subiria um servidor que nunca sai, e o provisionamento travaria ali.
# As migrations entram no SEED_CMD abaixo, antes do seed, que é o único ponto do
# provisionamento em que um comando de vida curta roda dentro do backend.
MIGRATE_SERVICE=""

# O que sobe depois das migrations. Deixe DE FORA os workers que acordam sozinhos
# e falam com serviço externo: N canteiros significam N cópias fazendo isso em
# paralelo sem ninguém olhando.
#
# O `frontend` entra: o Vite é serviço do Compose, na rede interna do canteiro.
# Nenhum deles fala com serviço externo nem acorda sozinho.
SERVICES=(backend frontend nginx)

# ── Seed ─────────────────────────────────────────────────────────────
# Põe o banco do canteiro num estado conhecido — é o contrato que os `verify` das
# user stories assumem. Deve ser idempotente. Vazio pula o passo.
#
# `migrate` vem junto porque não há MIGRATE_SERVICE (ver acima); os dois são
# idempotentes, então repetir o passo não estraga nada. `sh -c` porque SEED_CMD é
# um comando só e aqui precisamos de dois encadeados.
#
# O `seed_demo` do projeto semeia dois programas de pós-graduação — a tenancy
# daqui é por Program (`apps/core/tenancy.py`), e com um só a query que esqueceu
# o filtro devolve exatamente o mesmo resultado da query correta.
SEED_CMD=(docker compose exec -T backend sh -c
  "uv run python manage.py migrate --noinput && uv run python manage.py seed_demo")

# ── Peças da esteira que precisam existir NA BASE ────────────────────
# Conferidas antes de criar worktree nenhuma. Sem esta guarda, a falta só
# aparece no meio do provisionamento, longe da causa.
ESTEIRA=(
  scripts/helton/helton.sh
  scripts/helton/CLAUDE.md
  .claude/skills/cronograma/SKILL.md
)

# ── Portas do host ───────────────────────────────────────────────────
# As bases que o `.env.worktree` usa. Servem para o script relatar os endereços
# do canteiro; precisam bater com o que está lá.
#
# ATENÇÃO à aritmética: com offset múltiplo de 10 na faixa 100–990, duas famílias
# de porta colidem se a distância entre suas bases for múltiplo de 10 e menor que
# 900. As quatro daqui estão conferidas: 433, 2647, 2592, 3025 e 55 não são
# múltiplos de 10, e a única distância que é (3080, entre APP e WEB) passa dos
# 900. Trocar uma base sem refazer essa conta reabre a colisão.
#
# Este projeto publica DUAS portas, não quatro: a do nginx (WEB) e a do Postgres
# (DB). APP e MAIL não existem aqui — o Django só responde por trás do nginx e
# não há captura de e-mail — mas as quatro variáveis são obrigatórias no
# montar-canteiro.sh, então ficam com bases reservadas e rótulo que avisa. Os
# dois endereços correspondentes aparecem no relatório final e devem ser
# ignorados; nada escuta neles.
#
# O Vite NÃO entra nesta conta, e é o ponto da mudança que o trouxe para o
# Compose: ele escuta na 5173 da rede interna de cada canteiro, que não é
# publicada. Porta interna não colide com a de outra stack.
PORT_APP=5000
PORT_DB=5433
PORT_WEB=8080
PORT_MAIL=8025

# Rótulos do relatório final, na mesma ordem das portas acima.
LABEL_APP="api (NÃO publicada — o Django só atende pelo nginx)"
LABEL_DB="banco"
LABEL_WEB="app"
LABEL_MAIL="e-mail capturado (NÃO existe neste projeto)"

# ── Dependências do host ─────────────────────────────────────────────
# Roda no fim do provisionamento, com a stack já de pé e `$WT_DIR` disponível.
# Aqui entra o que o git NÃO traz e sem o qual a primeira verificação da worktree
# quebra: dependências não versionadas e artefatos gerados.
#
# `npm ci` e `uv sync --locked` — e não `npm install`/`uv sync` — porque estes
# reescrevem o lockfile: o canteiro nasceria com a árvore suja e o primeiro
# commit do loop, que usa `git add -A`, varreria esse ruído para dentro da
# empreitada.
#
# `make gen-api` NÃO entra aqui: o `schema.d.ts` é versionado de propósito (ver o
# rodapé do .gitignore), então regenerá-lo no provisionamento sujaria a árvore
# sem necessidade. Quando o contrato da API muda, quem roda é o loop, e a mudança
# aparece no diff — que é onde ela deve ser vista.
instalar_dependencias() {
  ( cd "$WT_DIR/frontend" && npm ci --no-fund --no-audit --silent )
  ( cd "$WT_DIR/backend" && uv sync --locked )
}

# ── Comportamento ────────────────────────────────────────────────────
# Acima disto, `--todos` confirma antes de montar: cada canteiro é uma stack
# Docker inteira.
LIMITE_SEM_PERGUNTAR=3
